<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dado 3D</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 30%, #e8fff0 0%, #c8f0d8 60%, #a8e0c0 100%);
    color: #111;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.container {
    width: 100%;
    max-width: 500px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 50px;
    padding: 30px;
}

h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: 3px;
    text-transform: uppercase;
    user-select: none;
    color: #0d5c2c;
}

.scene {
    width: 180px;
    height: 180px;
    perspective: 800px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

.sombra {
    position: absolute;
    width: 130px;
    height: 25px;
    bottom: -30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 80, 40, .28);
    border-radius: 50%;
    filter: blur(10px);
    transition: transform .6s ease, opacity .6s ease;
}

.dado.animando ~ .sombra {
    transform: translateX(-50%) scale(.6);
    opacity: .35;
}

.dado {
    width: 150px;
    height: 150px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 1.8s cubic-bezier(.2,.9,.25,1);
}

.face {
    position: absolute;
    width: 150px;
    height: 150px;
    background: linear-gradient(145deg, #5fd68a, #2ea85c);
    border: 4px solid #0d5c2c;
    border-radius: 18px;
    display: grid;
    padding: 20px;
    box-shadow:
        inset 0 0 0 1px #1a7a3d,
        inset 0 -8px 20px rgba(0,0,0,.15),
        0 0 0 1px #0d5c2c;
    backface-visibility: hidden;
}

.face span {
    width: 22px;
    height: 22px;
    background: radial-gradient(circle at 30% 30%, #4aa8ff, #0a4fa8);
    border-radius: 50%;
    display: block;
    box-shadow:
        inset 0 2px 3px rgba(255,255,255,.35),
        0 0 6px rgba(10, 79, 168, .5);
}

/* Posicionamento das faces (150/2 = 75) */
.face1 { transform: rotateY(  0deg) translateZ(75px); }
.face2 { transform: rotateY( 90deg) translateZ(75px); }
.face3 { transform: rotateY(180deg) translateZ(75px); }
.face4 { transform: rotateY(-90deg) translateZ(75px); }
.face5 { transform: rotateX( 90deg) translateZ(75px); }
.face6 { transform: rotateX(-90deg) translateZ(75px); }

/* Layout dos pontos */
.face1 { grid-template-columns: 1fr; grid-template-rows: 1fr; place-items: center; }

.face2, .face4 {
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    align-items: center;
    justify-items: center;
}

.face3 {
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    place-items: center;
}
.face3 span:nth-child(1) { grid-column: 1; grid-row: 1; }
.face3 span:nth-child(2) { grid-column: 2; grid-row: 2; }
.face3 span:nth-child(3) { grid-column: 3; grid-row: 3; }

.face5 {
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    place-items: center;
}
.face5 span:nth-child(1) { grid-column: 1; grid-row: 1; }
.face5 span:nth-child(2) { grid-column: 3; grid-row: 1; }
.face5 span:nth-child(3) { grid-column: 2; grid-row: 2; }
.face5 span:nth-child(4) { grid-column: 1; grid-row: 3; }
.face5 span:nth-child(5) { grid-column: 3; grid-row: 3; }

.face6 {
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    align-items: center;
    justify-items: center;
}

button {
    border: 3px solid #0d5c2c;
    background: #0d5c2c;
    color: #fff;
    padding: 16px 45px;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    transition: .2s;
    outline: none;
    user-select: none;
}

button:hover:not(:disabled) { background: #0a4fa8; border-color: #0a4fa8; }
button:active:not(:disabled) { transform: scale(.96); }
button:disabled { opacity: .6; cursor: not-allowed; }
button:focus-visible { box-shadow: 0 0 0 4px rgba(10, 79, 168, .4); }

.historico {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    min-height: 32px;
    max-width: 320px;
}

.historico .bolinha {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #5fd68a;
    border: 2px solid #0d5c2c;
    color: #0a4fa8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: bold;
    animation: pop .35s ease;
}

.historico .bolinha.recente {
    background: #0a4fa8;
    border-color: #0a4fa8;
    color: #fff;
}

@keyframes pop {
    0%   { transform: scale(.7); opacity: 0; }
    60%  { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); }
}

/* Acessibilidade: texto só para leitores de tela */
.sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
}

@media (max-width: 400px) {
    .container { gap: 40px; }
    h1 { font-size: 23px; }
    .scene { transform: scale(.85); }
    button { width: 85%; max-width: 300px; }
}

@media (prefers-reduced-motion: reduce) {
    .dado { transition-duration: .4s; }
    .historico .bolinha { animation: none; }
}
</style>
</head>

<body>

<div class="container">

    <h1>Jogue o dado</h1>

    <div class="scene">
        <div class="dado" id="dado" aria-hidden="true">
            <div class="face face1"><span></span></div>
            <div class="face face2"><span></span><span></span></div>
            <div class="face face3"><span></span><span></span><span></span></div>
            <div class="face face4"><span></span><span></span><span></span><span></span></div>
            <div class="face face5"><span></span><span></span><span></span><span></span><span></span></div>
            <div class="face face6"><span></span><span></span><span></span><span></span><span></span><span></span></div>
        </div>
        <div class="sombra" aria-hidden="true"></div>
    </div>

    <button id="btnJogar" onclick="jogarDado()" aria-label="Jogar o dado">JOGAR</button>

    <div class="historico" id="historico" aria-hidden="true"></div>

    <div class="sr-only" role="status" aria-live="polite" id="anuncio"></div>

</div>

<script>
let baseX = 0;
let baseY = 0;
let jogando = false;
let audioCtx = null;
const historico = [];

// Fila embaralhada: a cada 6 jogadas, cada número sai exatamente uma vez.
let fila = [];

function proximoNumero() {
    if (fila.length === 0) {
        fila = [1, 2, 3, 4, 5, 6];
        for (let i = fila.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [fila[i], fila[j]] = [fila[j], fila[i]];
        }
    }
    return fila.pop();
}

const posicoes = {
    1: { x: 0,   y: 0   },
    2: { x: 0,   y: -90 },
    3: { x: 0,   y: 180 },
    4: { x: 0,   y: 90  },
    5: { x: -90, y: 0   },
    6: { x: 90,  y: 0   }
};

function getAudioCtx() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
}

function tocarSomResultado() {
    try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.18);

        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.22);
    } catch (e) { /* áudio é opcional */ }
}

function atualizarHistorico(valor) {
    const historicoEl = document.getElementById('historico');
    historico.unshift(valor);
    if (historico.length > 6) historico.pop();

    historicoEl.innerHTML = '';
    historico.forEach((v, i) => {
        const bolinha = document.createElement('div');
        bolinha.className = 'bolinha' + (i === 0 ? ' recente' : '');
        bolinha.textContent = v;
        historicoEl.appendChild(bolinha);
    });
}

function jogarDado() {
    if (jogando) return;
    jogando = true;

    const dado = document.getElementById('dado');
    const btn = document.getElementById('btnJogar');
    const anuncio = document.getElementById('anuncio');

    btn.disabled = true;
    anuncio.textContent = '';

    const numero = proximoNumero();
    const pos = posicoes[numero];

    baseX = 720 * (Math.floor(baseX / 720) + 1) + pos.x;
    baseY = 720 * (Math.floor(baseY / 720) + 1) + pos.y;

    dado.classList.add('animando');
    dado.style.transform = `rotateX(${baseX}deg) rotateY(${baseY}deg)`;

    setTimeout(() => {
        dado.classList.remove('animando');
        atualizarHistorico(numero);
        tocarSomResultado();

        anuncio.textContent = 'Resultado: ' + numero;

        jogando = false;
        btn.disabled = false;
    }, 1800);
}

document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        jogarDado();
    }
});
</script>

</body>
</html>
