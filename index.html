<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dado do Projeto</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
  }

  .container {
    width: min(92vw, 420px);
    text-align: center;
    padding: 28px 20px;
  }

  h1 {
    margin: 0 0 8px;
    font-size: 28px;
  }

  .instruction {
    margin: 0 0 24px;
    color: #666;
    font-size: 16px;
    line-height: 1.4;
  }

  .dice {
    width: 180px;
    height: 180px;
    margin: 0 auto 22px;
    border: 3px solid #222;
    border-radius: 28px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 92px;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
    touch-action: manipulation;
    box-shadow: 0 8px 22px rgba(0,0,0,.15);
  }

  .dice:focus-visible {
    outline: 3px solid #555;
    outline-offset: 4px;
  }

  .rolling {
    animation: shake .11s linear infinite;
  }

  @keyframes shake {
    0%   { transform: rotate(-7deg) scale(.96); }
    25%  { transform: rotate(7deg) scale(1.03); }
    50%  { transform: rotate(-5deg) scale(1.06); }
    75%  { transform: rotate(6deg) scale(1.02); }
    100% { transform: rotate(-7deg) scale(.96); }
  }

  #roll {
    border: 0;
    border-radius: 12px;
    padding: 14px 24px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    background: #222;
    color: white;
  }

  #roll:disabled {
    opacity: .55;
    cursor: default;
  }

  .result {
    margin-top: 18px;
    font-size: 18px;
    font-weight: bold;
  }

  @media (prefers-reduced-motion: reduce) {
    .rolling { animation: none; }
  }
</style>
</head>

<body>
  <main class="container">
    <h1>Dado</h1>
    <p class="instruction">Toque no dado ou no botão para sortear um número de 1 a 6.</p>

    <div
      id="dice"
      class="dice"
      role="button"
      tabindex="0"
      aria-label="Jogar o dado"
    >1</div>

    <button id="roll" type="button">Jogar o dado</button>

    <p id="result" class="result" aria-live="polite">Resultado: 1</p>
  </main>

<script>
(function () {
  const dice = document.getElementById("dice");
  const roll = document.getElementById("roll");
  const result = document.getElementById("result");

  let rolling = false;

  function randomNumber() {
    return Math.floor(Math.random() * 6) + 1;
  }

  function playDice() {
    if (rolling) return;

    rolling = true;
    dice.setAttribute("aria-disabled", "true");
    roll.disabled = true;
    dice.classList.add("rolling");

    let count = 0;

    const animation = setInterval(function () {
      dice.textContent = randomNumber();
      count++;

      if (count >= 14) {
        clearInterval(animation);

        const finalNumber = randomNumber();

        dice.textContent = finalNumber;
        result.textContent = "Resultado: " + finalNumber;

        dice.classList.remove("rolling");
        dice.removeAttribute("aria-disabled");
        roll.disabled = false;
        rolling = false;
      }
    }, 75);
  }

  dice.addEventListener("click", playDice);

  dice.addEventListener("keydown", function (event) {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      playDice();
    }
  });

  roll.addEventListener("click", playDice);
})();
</script>
</body>
</html>
